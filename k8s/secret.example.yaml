# EXAMPLE ONLY - do not apply as-is and do not commit real secrets.
# Copy to secret.yaml (git-ignored), fill in real values, and apply that; or
# better, create it from your secret manager / sealed-secrets / external-secrets.
#
#   kubectl create secret generic url-shortener-secrets -n url-shortener \
#     --from-literal=APP_APIKEYS_ACME='<real-secret>' \
#     --from-literal=APP_APIKEYS_PARTNER1='<real-secret>'
#
# Each APP_APIKEYS_<OWNER> entry binds to app.api-keys.<owner>; <owner> is what
# gets stored as ownerId on the records that key creates.
apiVersion: v1
kind: Secret
metadata:
  name: url-shortener-secrets
  namespace: url-shortener
type: Opaque
stringData:
  APP_APIKEYS_ACME: "replace-me-acme"
  APP_APIKEYS_PARTNER1: "replace-me-partner1"
