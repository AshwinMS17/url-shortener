apiVersion: v1
kind: ServiceAccount
metadata:
  name: url-shortener
  namespace: url-shortener
  annotations:
    # IRSA: the IAM role the pods assume to reach DynamoDB. Create it with
    # `eksctl create iamserviceaccount` (see k8s/README.md) or Terraform, then
    # put the role ARN here. The AWS SDK's DefaultCredentialsProvider picks up
    # the projected web-identity token automatically - no static keys needed.
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/url-shortener-dynamodb
