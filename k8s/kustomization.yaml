apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# `kubectl apply -k k8s/` applies everything below (secret.example.yaml is
# deliberately excluded - supply the real Secret separately).
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml

images:
  - name: <ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/url-shortener
    newTag: 0.1.0
